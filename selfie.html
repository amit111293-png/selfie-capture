<!DOCTYPE html>
<html>
<head>
  <title>Selfie Capture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h2>Capture Your Selfie</h2>
  <input type="file" accept="image/*" capture="user" id="selfieInput">
  <button onclick="previewSelfie()">Preview & Upload</button>
  <div id="preview"></div>

  <script>
    function previewSelfie() {
      const fileInput = document.getElementById('selfieInput');
      const file = fileInput.files[0];
      if(!file) { alert('Select a selfie first!'); return; }

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('preview').innerHTML = `
          <p>Preview:</p>
          <img src="${e.target.result}" style="width:200px; border-radius:10px;">
          <p>Send this image via WhatsApp, Email or your backend!</p>
        `;
      }
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
